[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "facescan-api"
dynamic = ["version"]
description = "HTTP service around the facescan core: analysis, adjustments, overlays and reports."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
# Exact versions (and hashes) are in requirements.lock; these are the direct dependencies.
dependencies = [
    "facescan==0.1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.7",
    "Pebble>=5.1",
    "python-multipart>=0.0.18",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx2>=2.13"]

[project.scripts]
facescan-api = "facescan_api.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "facescan_api._version.__version__" }

[tool.setuptools.packages.find]
include = ["facescan_api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
