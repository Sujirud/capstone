[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "facescan"
dynamic = ["version"]
description = "Facial aesthetic analysis core: frontal and profile measurements, overlays and reports."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
    # mediapipe 1.0.1 aborts on macOS arm64 (Metal helper in TensorsToDetectionsCalculator); 1.0.0 is pinned.
    "mediapipe==1.0.0",
    # mediapipe depends on opencv-contrib-python; installing opencv-python as well breaks the cv2 module.
    "opencv-contrib-python>=4.10",
    "numpy>=1.26",
    "scipy>=1.11",
    "PyYAML>=6.0",
    "pydantic>=2.6,<3",
    "Pillow>=10.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
facescan-analyze = "facescan.apps.analyze_image:main"
facescan-report = "facescan.apps.build_report:main"
facescan-capture = "facescan.apps.webcam_capture:main"
facescan-download-models = "facescan.tools.download_models:main"
facescan-debug-landmarks = "facescan.tools.debug_landmarks:main"
facescan-evaluate = "facescan.tools.evaluate:main"

[tool.setuptools.dynamic]
version = { attr = "facescan._version.__version__" }

[tool.setuptools.packages.find]
include = ["facescan*"]

[tool.setuptools.package-data]
facescan = ["config/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
