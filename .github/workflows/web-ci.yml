# Web app CI: contract types, type check, lint, unit and component tests,
# build, end-to-end tests with mocks (WebKit and Chromium mobile emulation, axe; live mode
# with Chromium's fake camera and the real model), and the fixtures regenerated from the
# real core and API.
name: web-ci
on:
  push:
    paths:
      - "web/**"
      - "api/**"
      - "facescan/**"
      - "tests/**"
      - ".github/workflows/web-ci.yml"
  pull_request:
    paths:
      - "web/**"
      - "api/**"
      - "facescan/**"
      - "tests/**"
      - ".github/workflows/web-ci.yml"

jobs:
  web:
    runs-on: ubuntu-24.04
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
      - name: pnpm (version from package.json, through corepack)
        run: corepack enable && pnpm --version
      - run: pnpm install --frozen-lockfile
      # Live mode serves the server's face model itself (scripts/copy_live_assets.mjs checks
      # it against the core's pinned SHA-256); the build and the camera tests need it.
      - uses: actions/cache@v4
        with:
          path: models
          key: models-${{ hashFiles('facescan/tools/download_models.py') }}
      - name: Model files (standard library only)
        working-directory: .
        run: python3 facescan/tools/download_models.py --dest models
      # The committed types must equal the ones generated from api/openapi.json.
      - run: pnpm check:types
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm e2e
        env:
          CI: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

  # Fixtures must match what the current core and API produce (scripts/gen_fixtures.py).
  fixtures:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: System libraries (OpenCV, MediaPipe, RAQM)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0 libx11-6 libxext6 libxcb1 libsm6 libice6 libfribidi0
      - name: Core and API (locked)
        run: |
          python -m pip install --quiet --require-hashes --only-binary=:all: -r api/requirements.lock -r api/requirements-dev.lock
          python -m pip install --quiet --no-deps -e . -e api
          python facescan/tools/download_models.py --dest models
      - run: python web/scripts/gen_fixtures.py --check
