  subnasale: {name: "ฐานจมูก", instruction: "เลื่อนจุดไปยังตำแหน่งที่ฐานจมูกพบกับริมฝีปากบน"}
  labrale_superius: {name: "ริมฝีปากบน", instruction: "เลื่อนจุดไปยังจุดที่ยื่นที่สุดของริมฝีปากบน"}
  labrale_inferius: {name: "ริมฝีปากล่าง", instruction: "เลื่อนจุดไปยังจุดที่ยื่นที่สุดของริมฝีปากล่าง"}
  soft_tissue_pogonion: {name: "คาง", instruction: "เลื่อนจุดไปยังจุดที่ยื่นที่สุดของคาง"}
  menton: {name: "ใต้คาง", instruction: "เลื่อนจุดไปยังจุดต่ำสุดของคาง"}
  alar_crease: {name: "ข้างปีกจมูก", instruction: "วางจุดที่ตำแหน่งที่ปีกจมูกพบกับแก้ม"}

