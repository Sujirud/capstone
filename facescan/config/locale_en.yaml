  profile_in_frame: "Keep your whole profile, from forehead to neck, inside the photo, with nothing in front of your face or neck."
  profile_pose: "Turn exactly sideways, close your lips gently, and keep hair, hands and clothing away from your face outline."
  profile_level: "Keep your head level and look straight ahead at a point at eye level."
  face_in_frame: "Make sure your whole face, from hairline to chin, is inside the photo."
  no_face: "No face was found. Face the camera so your whole face is visible."
  multiple_faces: "More than one face was found. Only the person being measured should be in the photo."
  distance_unverified: "The camera distance could not be checked for this photo."
  move_back: "Move the camera a little farther away (about 1.5 m) and use 2–3× zoom."
  turn_left: "Turn your head slightly to your left."
  turn_right: "Turn your head slightly to your right."
  chin_down: "Lower your chin slightly."
  chin_up: "Raise your chin slightly."
  head_level: "Keep your head level, without tilting it."
  close_mouth: "Close your lips gently."
  relax_smile: "Relax your face into a neutral expression, without smiling."
  open_eyes: "Keep your eyes open and look at the lens."
  relax_brows: "Relax your eyebrows."
  neutral_expression: "Relax your face into a neutral expression."
  face_too_small: "Your face is too small in the photo. Zoom in (2–3×) or use a higher-resolution camera instead of moving closer."
  hold_still: "Hold still and make sure the camera is focused on your face."
  more_light: "Find brighter, even light on your face."
  less_light: "Reduce the light on your face or avoid direct light."
  avoid_glare: "Avoid strong light or deep shadows on your face."

