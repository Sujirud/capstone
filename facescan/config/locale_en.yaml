  background_contrast: "Background contrast"
  facing: "Facing direction"
  contour_continuous: "Complete profile outline"
  profile_points: "Profile points found"
  pronasale_most_anterior: "Nose tip position"
  landmark_order: "Profile outline shape"
  head_tilt_deg: "Head level"
  face_in_frame: "Whole face in the photo"
  face_count: "One face in the photo"
  camera_distance_m: "Camera distance"
