# English user-facing text. Wording rules: neutral and informational,
# never a diagnosis, never "you need…", never words such as defect, flaw,
# abnormal or ugly; no scores, rankings or comparisons with other people.
# The clinical team reviews every string before launch.
locale: en
language_name: English

reference:
  canon: "Classical proportion reference"
  population: "Typical range"
  note: "Reference ranges describe classical proportions or typical measurements. Faces differ naturally, and values outside a range are common."

side_note: "Right and left refer to your own right and left."

status:
  within: "Within the reference range"
  above: "Above the reference range"
  below: "Below the reference range"
  inconclusive: "Too close to the reference limit to tell apart from measurement variation"
  unavailable: "Could not be measured from this photo"
  no_reference: "Shown for information"

confidence:
  high: "Measured automatically"
  low: "Approximate: this point is hard to place automatically"

flags:
  large_user_adjustment: "You moved this point far from where it was detected, so this value is shown for information only."
  no_automatic_position: "This point was placed by hand, so this value is approximate."
  uncertainty_unavailable: "The measurement precision could not be estimated for this value."

units:
  "%E-line": "% of the nose–chin line"
  fraction: ""
  ratio: ""
  deg: "°"
  mm: " mm"
  "%ICD": "% of eye spacing"

